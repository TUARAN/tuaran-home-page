name: 缺陷
description: 可复现的页面、接口或构建问题
title: "[Bug] "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        站长与助手的步骤见 `docs/runbooks/issue-first-workflow.md`。不要在 Issue 中提交 API key、token、密码或私人联系方式。
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 按顺序写出怎样看到这个问题。
      placeholder: |
        1. 打开 ...
        2. 操作 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: 页面路径
      description: 站内路径或完整 URL。没有页面时，写命令、接口或 workflow 名称。
      placeholder: /articles/...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响
      description: 谁受影响，是否挡住发布或日常使用。
    validations:
      required: true
