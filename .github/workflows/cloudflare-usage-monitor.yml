name: Cloudflare usage daily report

on:
  schedule:
    # UTC day ends at 08:00 Asia/Shanghai; collect after analytics settles.
    - cron: '20 0 * * *'
    # Sample today's usage every 3 hours so 80% free-tier alerts fire before exhaustion.
    - cron: '10 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Collect Workers and D1 usage
        env:
          SITE_STATUS_SECRET: ${{ secrets.SITE_STATUS_MONITOR_SECRET || secrets.AUTOMATION_ALERT_SECRET }}
        run: |
          if [ -z "$SITE_STATUS_SECRET" ]; then
            echo "SITE_STATUS_MONITOR_SECRET or AUTOMATION_ALERT_SECRET is required."
            exit 1
          fi
          body_file=$(mktemp)
          set +e
          status=$(curl --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 5 --max-time 90 \
            -o "$body_file" -w '%{http_code}' \
            -X POST 'https://admin.2aran.com/api/admin/cloudflare-usage/collect' \
            -H 'Accept: application/json' \
            -H "x-site-status-secret: $SITE_STATUS_SECRET")
          curl_exit=$?
          set -e
          echo "HTTP ${status:-000}"
          cat "$body_file"
          echo
          if [ "$curl_exit" -ne 0 ]; then
            exit "$curl_exit"
          fi
          result=$(cat "$body_file")
          echo "$result" | jq -e '.ok == true' >/dev/null
          {
            echo '## Cloudflare 用量（UTC）'
            echo '| 日期 | Workers 调用 | D1 读取行数 | D1 写入行数 | 预警 |'
            echo '| --- | ---: | ---: | ---: | ---: |'
            echo "$result" | jq -r '.reports[] | "| \(.date) | \(.workers) | \(.d1RowsRead) | \(.d1RowsWritten) | \((.alerts // []) | length) |"'
            echo ''
            echo "今日新增站长通知：$(echo "$result" | jq -r '.notified // 0')"
            echo ''
            echo '### 请求量最高的入口路径（今日快照优先）'
            echo '| 路径 | 请求数 | 主要状态码 |'
            echo '| --- | ---: | --- |'
            echo "$result" | jq -r '(.reports | reverse)[0].topPaths[]? // empty | "| `\(.path)` | \(.requests) | \(.statuses | to_entries | sort_by(-.value) | .[:3] | map("\(.key): \(.value)") | join(", ")) |"'
          } >> "$GITHUB_STEP_SUMMARY"
