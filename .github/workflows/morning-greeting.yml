name: Daily greetings to X

on:
  schedule:
    # 每 5 分钟检查当天随机排程；API 按上海日与时段去重。
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      period:
        description: Greeting period, community slot, culture story slot, crypto slot, or US English slot
        required: true
        type: choice
        default: morning
        options: [morning, noon, evening, community_friends, community_learning, community_growth, culture_morning, culture_afternoon, culture_evening, crypto_knowledge, crypto_market, crypto_people, us_morning, us_midday, us_evening]

permissions:
  contents: read

concurrency:
  group: daily-greeting-${{ github.event.schedule || inputs.period }}
  cancel-in-progress: false

jobs:
  post:
    name: Publish daily greeting to X
    runs-on: ubuntu-latest
    # 到期任务并行执行；失败由后续轮询补跑，最多延续计划时间后一小时。
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish due X posts
        env:
          MORNING_GREETING_SECRET: ${{ secrets.MORNING_GREETING_SECRET }}
          MANUAL_PERIOD: ${{ inputs.period }}
        run: node scripts/run-x-auto-posts.mjs

      - name: Notify owner of failure
        if: failure()
        env:
          ALERT_SECRET: ${{ secrets.AUTOMATION_ALERT_SECRET || secrets.WEEKLY_SUMMARY_SECRET || secrets.PUBLIC_OPINION_COLLECT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(python3 - <<'PY'
          import json, os
          detail = ""
          try:
              detail = open("/tmp/morning-greeting.json").read().strip()[:300]
          except OSError:
              pass
          print(json.dumps({
              "workflow": "morning-greeting",
              "taskName": "X 每日自动发布（问候 / 朋友交流 / 文化短故事 / 加密观点 / 美区英文）",
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runUrl": os.environ.get("RUN_URL", ""),
              "status": "failed",
              "error": detail,
          }, ensure_ascii=False))
          PY
          )
          curl -sS --retry 2 --retry-delay 5 --fail-with-body \
            -X POST \
            -H "x-automation-alert-secret: $ALERT_SECRET" \
            -H "content-type: application/json" \
            -d "$BODY" \
            https://2aran.com/api/automation/alert || echo "alert delivery failed (non-fatal)"
