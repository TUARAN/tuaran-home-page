name: Daily greetings to X

on:
  schedule:
    # 问候 08:00 / 12:00 / 22:00，朋友图文帖 09:00 / 15:00 / 19:00，文化短故事 10:00 / 16:00 / 20:00；每组 20、40 分钟补跑（UTC）。
    - cron: '0,20,40 0 * * *'
    - cron: '0,20,40 1 * * *'
    - cron: '0,20,40 2 * * *'
    - cron: '0,20,40 4 * * *'
    - cron: '0,20,40 7 * * *'
    - cron: '0,20,40 8 * * *'
    - cron: '0,20,40 11 * * *'
    - cron: '0,20,40 12 * * *'
    - cron: '0,20,40 14 * * *'
  workflow_dispatch:
    inputs:
      period:
        description: Greeting period or culture story slot
        required: true
        type: choice
        default: morning
        options: [morning, noon, evening, community_friends, community_learning, community_growth, culture_morning, culture_afternoon, culture_evening]

concurrency:
  group: daily-greeting-${{ github.event.schedule || inputs.period }}
  cancel-in-progress: false

jobs:
  post:
    name: Publish daily greeting to X
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/distribution/x/greeting
        env:
          MORNING_GREETING_SECRET: ${{ secrets.MORNING_GREETING_SECRET }}
        run: |
          if [ -z "$MORNING_GREETING_SECRET" ]; then
            echo "::error::缺少仓库 Secret MORNING_GREETING_SECRET"
            exit 1
          fi

          case "${{ github.event.schedule }}" in
            "0,20,40 1 * * *") PERIOD="community_friends" ;;
            "0,20,40 2 * * *") PERIOD="culture_morning" ;;
            "0,20,40 4 * * *") PERIOD="noon" ;;
            "0,20,40 7 * * *") PERIOD="community_learning" ;;
            "0,20,40 8 * * *") PERIOD="culture_afternoon" ;;
            "0,20,40 11 * * *") PERIOD="community_growth" ;;
            "0,20,40 12 * * *") PERIOD="culture_evening" ;;
            "0,20,40 14 * * *") PERIOD="evening" ;;
            "") PERIOD="${{ inputs.period }}" ;;
            *) PERIOD="morning" ;;
          esac

          if [[ "$PERIOD" == culture_* ]]; then
            QUERY="story=$PERIOD"
          elif [[ "$PERIOD" == community_* ]]; then
            QUERY="community=$PERIOD"
          else
            QUERY="period=$PERIOD"
          fi

          code=$(curl -sS --retry 2 --retry-delay 5 \
            -o /tmp/morning-greeting.json \
            -w '%{http_code}' \
            -X POST \
            -H "x-morning-greeting-secret: $MORNING_GREETING_SECRET" \
            "https://2aran.com/api/distribution/x/greeting?$QUERY")

          echo "HTTP $code"
          cat /tmp/morning-greeting.json
          echo
          if [ "$code" = "423" ]; then
            echo "后台已暂停该自动化，本次跳过（视为成功，不发布）。"
            exit 0
          fi
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            exit 1
          fi

      - name: Notify owner of failure
        if: failure()
        env:
          ALERT_SECRET: ${{ secrets.AUTOMATION_ALERT_SECRET || secrets.WEEKLY_SUMMARY_SECRET || secrets.PUBLIC_OPINION_COLLECT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(python3 - <<'PY'
          import json, os
          detail = ""
          try:
              detail = open("/tmp/morning-greeting.json").read().strip()[:300]
          except OSError:
              pass
          print(json.dumps({
              "workflow": "morning-greeting",
              "taskName": "X 每日自动发布（问候 / 朋友图文 / 文化短故事）",
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runUrl": os.environ.get("RUN_URL", ""),
              "status": "failed",
              "error": detail,
          }, ensure_ascii=False))
          PY
          )
          curl -sS --retry 2 --retry-delay 5 --fail-with-body \
            -X POST \
            -H "x-automation-alert-secret: $ALERT_SECRET" \
            -H "content-type: application/json" \
            -d "$BODY" \
            https://2aran.com/api/automation/alert || echo "alert delivery failed (non-fatal)"
