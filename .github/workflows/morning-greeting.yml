name: High-frequency text posts to X

on:
  schedule:
    # 每 5 分钟检查当天均匀排程；API 按上海日与时段去重。
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      period:
        description: 手动运行的槽位（如 joke_morning_01、joke_afternoon_01、joke_night_01）
        required: true
        type: string
        default: joke_morning_01

permissions:
  contents: read

concurrency:
  group: high-frequency-x-posts-${{ github.event.schedule || inputs.period }}
  cancel-in-progress: false

jobs:
  post:
    name: Publish due X post
    runs-on: ubuntu-latest
    # 每天 23 条：高频短帖 10 条，交朋友 3 条，其余分类 10 条。
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish due X posts
        env:
          MORNING_GREETING_SECRET: ${{ secrets.MORNING_GREETING_SECRET }}
          MANUAL_PERIOD: ${{ inputs.period }}
        run: node scripts/run-x-auto-posts.mjs

      - name: Notify owner of failure
        if: failure()
        env:
          ALERT_SECRET: ${{ secrets.AUTOMATION_ALERT_SECRET || secrets.WEEKLY_SUMMARY_SECRET || secrets.PUBLIC_OPINION_COLLECT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(python3 - <<'PY'
          import json, os
          detail = ""
          try:
              detail = open("/tmp/morning-greeting.json").read().strip()[:300]
          except OSError:
              pass
          print(json.dumps({
              "workflow": "morning-greeting",
              "taskName": "X 高频纯文字短帖发布",
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runUrl": os.environ.get("RUN_URL", ""),
              "status": "failed",
              "error": detail,
          }, ensure_ascii=False))
          PY
          )
          curl -sS --retry 2 --retry-delay 5 --fail-with-body \
            -X POST \
            -H "x-automation-alert-secret: $ALERT_SECRET" \
            -H "content-type: application/json" \
            -d "$BODY" \
            https://2aran.com/api/automation/alert || echo "alert delivery failed (non-fatal)"
