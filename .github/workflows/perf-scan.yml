name: Autopilot · Performance scan

on:
  schedule:
    # 每两周一次：周三 01:17 UTC = 北京 09:17，偶数 ISO 周执行
    - cron: '17 1 * * 3'
  workflow_dispatch: {}

concurrency:
  group: autopilot-perf-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    name: Scan and report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Biweekly parity (skip odd ISO weeks)
        id: parity
        run: |
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run performance scan
        if: github.event_name != 'schedule' || steps.parity.outputs.skip != 'true'
        run: node scripts/scan-performance.mjs

      - name: DeepSeek analysis
        if: github.event_name != 'schedule' || steps.parity.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/scan-analyze.mjs performance

      - name: Upload report
        if: github.event_name != 'schedule' || steps.parity.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: performance-scan-report
          path: data/audits/performance-*.json
          if-no-files-found: error

      - name: Summarize and file issue
        if: github.event_name != 'schedule' || steps.parity.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scan-handoff.mjs performance

      - name: Auto fix and Draft PR
        if: github.event_name != 'schedule' || steps.parity.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scan-fix-pr.mjs performance
