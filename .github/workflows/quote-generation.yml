name: Daily quote generation

on:
  schedule:
    # 每天北京时间 08:17 生成一条原创短句并加入名言池。
    - cron: '17 0 * * *'
  workflow_dispatch: {}

concurrency:
  group: quote-generation
  cancel-in-progress: false

jobs:
  generate:
    name: POST /api/cron/quotes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate and record quote
        env:
          QUOTE_GENERATION_SECRET: ${{ secrets.QUOTE_GENERATION_SECRET }}
          PUBLIC_OPINION_COLLECT_SECRET: ${{ secrets.PUBLIC_OPINION_COLLECT_SECRET }}
          WEEKLY_SUMMARY_SECRET: ${{ secrets.WEEKLY_SUMMARY_SECRET }}
        run: |
          TRIGGER_SECRET="${QUOTE_GENERATION_SECRET:-${WEEKLY_SUMMARY_SECRET:-$PUBLIC_OPINION_COLLECT_SECRET}}"
          if [ -z "$TRIGGER_SECRET" ]; then
            echo "::error::缺少仓库 Secret QUOTE_GENERATION_SECRET（或 WEEKLY_SUMMARY_SECRET / PUBLIC_OPINION_COLLECT_SECRET）"
            exit 1
          fi

          code=$(curl -sS --retry 2 --retry-delay 8 \
            -o /tmp/quote-generation.json \
            -w '%{http_code}' \
            -X POST \
            -H "x-quote-generation-secret: $TRIGGER_SECRET" \
            https://2aran.com/api/cron/quotes)

          echo "HTTP $code"
          cat /tmp/quote-generation.json
          echo
          if [ "$code" != "200" ]; then exit 1; fi

      - name: Notify owner of failure
        if: failure()
        env:
          ALERT_SECRET: ${{ secrets.AUTOMATION_ALERT_SECRET || secrets.WEEKLY_SUMMARY_SECRET || secrets.PUBLIC_OPINION_COLLECT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(python3 - <<'PY'
          import json, os
          try:
              detail = open('/tmp/quote-generation.json').read().strip()[:300]
          except OSError:
              detail = ''
          print(json.dumps({
              'workflow': 'quote-generation',
              'taskName': '每日名言生成',
              'runId': os.environ.get('GITHUB_RUN_ID', ''),
              'runUrl': os.environ.get('RUN_URL', ''),
              'status': 'failed',
              'error': detail,
          }, ensure_ascii=False))
          PY
          )
          curl -sS --retry 2 --retry-delay 5 --fail-with-body \
            -X POST \
            -H "x-automation-alert-secret: $ALERT_SECRET" \
            -H "content-type: application/json" \
            -d "$BODY" \
            https://2aran.com/api/automation/alert || echo "alert delivery failed (non-fatal)"
