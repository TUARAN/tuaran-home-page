name: Research PV history cleanup

on:
  schedule:
    # GitHub Actions 使用 UTC；每日 18:23 UTC = 上海时间次日 02:23。
    - cron: '23 18 * * *'
  workflow_dispatch: {}

concurrency:
  group: research-pv-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete expired reading history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/maintenance/research-pv-hits
        env:
          PV_CLEANUP_SECRET: ${{ secrets.PV_CLEANUP_SECRET || secrets.WEEKLY_SUMMARY_SECRET || secrets.PUBLIC_OPINION_COLLECT_SECRET }}
        run: |
          if [ -z "$PV_CLEANUP_SECRET" ]; then
            echo "::error::缺少仓库 Secret PV_CLEANUP_SECRET，且没有可用的兼容 Secret"
            exit 1
          fi

          code=$(curl -sS --retry 2 --retry-delay 5 \
            -o /tmp/research-pv-cleanup-response.json \
            -w '%{http_code}' \
            -X POST \
            -H "x-pv-cleanup-secret: $PV_CLEANUP_SECRET" \
            https://2aran.com/api/maintenance/research-pv-hits)

          echo "HTTP $code"
          cat /tmp/research-pv-cleanup-response.json
          echo
          test "$code" = "200"

      - name: Notify owner of failure
        if: failure()
        env:
          ALERT_SECRET: ${{ secrets.AUTOMATION_ALERT_SECRET || secrets.WEEKLY_SUMMARY_SECRET || secrets.PUBLIC_OPINION_COLLECT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(python3 - <<'PY'
          import json, os
          detail = ""
          try:
              detail = open("/tmp/research-pv-cleanup-response.json").read().strip()[:300]
          except OSError:
              pass
          print(json.dumps({
              "workflow": "research-pv-cleanup",
              "taskName": "阅读历史清理",
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "runUrl": os.environ.get("RUN_URL", ""),
              "status": "failed",
              "error": detail,
          }, ensure_ascii=False))
          PY
          )
          curl -sS --retry 2 --retry-delay 5 --fail-with-body \
            -X POST \
            -H "x-automation-alert-secret: $ALERT_SECRET" \
            -H "content-type: application/json" \
            -d "$BODY" \
            https://2aran.com/api/automation/alert || echo "alert delivery failed (non-fatal)"
