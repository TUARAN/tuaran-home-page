name: Autopilot · Security scan

on:
  schedule:
    # 每周一 01:17 UTC = 北京 09:17，避开整点
    - cron: '17 1 * * 1'
  workflow_dispatch: {}

concurrency:
  group: autopilot-security-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    name: Scan and report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Run security scan
        run: node scripts/scan-security.mjs

      - name: DeepSeek analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/scan-analyze.mjs security

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: data/audits/security-*.json
          if-no-files-found: error

      - name: Summarize and file issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scan-handoff.mjs security

      - name: Auto fix and Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/scan-fix-pr.mjs security
