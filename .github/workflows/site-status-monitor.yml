name: Site status monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-status-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe site and update public status
        env:
          SITE_STATUS_SECRET: ${{ secrets.SITE_STATUS_MONITOR_SECRET || secrets.AUTOMATION_ALERT_SECRET }}
        run: |
          if [ -z "$SITE_STATUS_SECRET" ]; then
            echo "SITE_STATUS_MONITOR_SECRET or AUTOMATION_ALERT_SECRET is required."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 30 \
            -X POST 'https://2aran.com/api/site-status/monitor' \
            -H "x-site-status-secret: $SITE_STATUS_SECRET"
