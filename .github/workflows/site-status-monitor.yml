name: Site status monitor

# 备份探活，不是主心跳。主跑手是独立 Worker cron（workers/site-status-scheduler）。
# GitHub 的 */5 近日实际间隔可拉到数小时，不能当可靠心跳。
# Worker cron 在站长说「合」并完成后续部署之前不会生效；在此之前本工作流仍是仓库内唯一已上线的探活入口。
on:
  schedule:
    # 每 30 分钟备份一次，错开整点和常见 5 分钟槽。
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-status-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe site and update public status
        env:
          SITE_STATUS_SECRET: ${{ secrets.SITE_STATUS_MONITOR_SECRET || secrets.AUTOMATION_ALERT_SECRET }}
        run: |
          if [ -z "$SITE_STATUS_SECRET" ]; then
            echo "SITE_STATUS_MONITOR_SECRET or AUTOMATION_ALERT_SECRET is required."
            exit 1
          fi
          body_file=$(mktemp)
          set +e
          status=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 \
            -o "$body_file" -w '%{http_code}' \
            -X POST 'https://2aran.com/api/site-status/monitor' \
            -H "x-site-status-secret: $SITE_STATUS_SECRET")
          curl_exit=$?
          set -e
          echo "HTTP ${status:-000}"
          cat "$body_file"
          echo
          if [ "$curl_exit" -ne 0 ]; then
            exit "$curl_exit"
          fi
