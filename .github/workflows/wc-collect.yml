name: World Cup collect

# 2026 世界杯活动已于 2026-07-21 归档，定时采集已停用。
# 保留手动入口只用于确认归档状态，不再请求生产 API 或写入 D1。
on:
  workflow_dispatch: {}

concurrency:
  group: wc-collect
  cancel-in-progress: false

jobs:
  archived:
    name: Archived activity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show archive status
        run: echo "Agent World Cup 2026 archived on 2026-07-21; collection is disabled."
