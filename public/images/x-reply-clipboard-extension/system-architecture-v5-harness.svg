<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2984 980" role="img" aria-labelledby="title desc">
  <title id="title">系统结构图 · v5 智能体 Harness</title>
  <desc id="desc">v5 在 v4 单页签底座之上的对话 Harness：面板、后台规划、只读工具、确认写操作与独立评论发帖链路。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b939c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3d7ab8"/>
    </marker>
    <style>
      .title { font: 700 34px system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #1a1f24; }
      .zone { font: 600 22px system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
      .box { font: 500 20px system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #1f2933; }
      .boxSub { font: 400 17px system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #5c6570; }
      .note { font: 400 18px system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #6b7280; }
    </style>
  </defs>
  <rect width="2984" height="980" fill="#ffffff"/>
  <text x="60" y="52" class="title">系统结构图 · v5 智能体 Harness（v4 单页签底座之上）</text>

  <rect x="40" y="78" width="2904" height="392" rx="18" fill="none" stroke="#7eb0d6" stroke-width="2" stroke-dasharray="14 10"/>
  <text x="60" y="108" class="zone">v5 智能体 Harness v3 · 规划与解释（不写评论、不发帖）</text>

  <g>
    <rect x="72" y="138" width="150" height="72" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="97" y="182" class="box">使用者</text>

    <path d="M222 174 H262" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="262" y="124" width="310" height="100" rx="14" fill="#eef6fc" stroke="#a8c4dc" stroke-width="2"/>
    <text x="288" y="162" class="box">X 页面内面板</text>
    <text x="288" y="192" class="boxSub">对话主界面 · agentChat</text>

    <path d="M572 174 H632" stroke="#3d7ab8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <path d="M632 194 H572" stroke="#3d7ab8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="582" y="168" class="boxSub" fill="#3d7ab8">xrc-agent-harness</text>

    <rect x="632" y="124" width="360" height="100" rx="14" fill="#eef6fc" stroke="#a8c4dc" stroke-width="2"/>
    <text x="658" y="162" class="box">扩展后台 Service Worker</text>
    <text x="658" y="192" class="boxSub">runAgentHarness · agentPlanner</text>

    <path d="M992 174 H1052" stroke="#3d7ab8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="1052" y="118" width="420" height="112" rx="14" fill="#eef6fc" stroke="#a8c4dc" stroke-width="2"/>
    <text x="1078" y="156" class="box">Harness 上下文</text>
    <text x="1078" y="184" class="boxSub">八条原则 · 角色 · 按账号人格与记忆</text>
    <text x="1078" y="212" class="boxSub">滚动摘要 · 预算裁剪（≤4 步 / 45 秒）</text>

    <path d="M1472 174 H1532" stroke="#3d7ab8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="1532" y="118" width="380" height="112" rx="14" fill="#eef6fc" stroke="#a8c4dc" stroke-width="2"/>
    <text x="1558" y="156" class="box">只读工具（自动查询）</text>
    <text x="1558" y="184" class="boxSub">schedule.now · facts.today</text>
    <text x="1558" y="212" class="boxSub">alerts.recent · engine.trace</text>

    <path d="M1912 174 H1972" stroke="#3d7ab8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="1972" y="118" width="360" height="112" rx="14" fill="#eef6fc" stroke="#a8c4dc" stroke-width="2"/>
    <text x="1998" y="156" class="box">写操作 · 确认卡片</text>
    <text x="1998" y="184" class="boxSub">暂停全部 · 开始全部</text>
    <text x="1998" y="212" class="boxSub">记住（冲突检查后与站长确认）</text>

    <rect x="2380" y="138" width="520" height="72" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="2406" y="170" class="box">规划模型回退</text>
    <text x="2406" y="198" class="boxSub">DeepSeek → B.AI → MobileOffice → NAS</text>
    <path d="M2332 174 H2380" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="262" y="268" width="2658" height="78" rx="14" fill="#fff9ee" stroke="#e8d4a8" stroke-width="2"/>
    <text x="288" y="314" class="note">评论 / 点赞 / 关注 / 发帖执行链路：独立模型与提示词，在共享执行页签内运行；不与 Harness 互读人格、记忆与规划提示词。</text>

    <path d="M812 224 V268" stroke="#8b939c" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="826" y="252" class="boxSub" fill="#6b7280">确认后排班命令</text>
  </g>

  <rect x="40" y="500" width="2904" height="450" rx="18" fill="none" stroke="#c8cdd3" stroke-width="2" stroke-dasharray="14 10"/>
  <text x="60" y="530" class="zone">v4 单页签底座 · 任务引擎 v6（十九项任务串行轮班）</text>

  <g>
    <rect x="72" y="558" width="430" height="88" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="98" y="596" class="box">十九项任务排班</text>
    <text x="98" y="626" class="boxSub">本地状态与闹钟 · createTaskEngine</text>

    <path d="M502 602 H562" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="562" y="558" width="400" height="88" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="588" y="596" class="box">扩展后台 Service Worker</text>
    <text x="588" y="626" class="boxSub">有界调度循环 · runTaskSchedule</text>

    <path d="M962 602 H1022" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1022 622 H962" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1022" y="558" width="380" height="88" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="1048" y="596" class="box">同账号共享 X 执行页签</text>
    <text x="1048" y="626" class="boxSub">一次只跑一项任务</text>

    <path d="M1402 602 H1462" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1462" y="558" width="360" height="88" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="1488" y="596" class="box">X 页面 DOM</text>
    <text x="1488" y="626" class="boxSub">回复 · 点赞 · 关注 · 发帖 · 删除</text>

    <path d="M1262 646 V700" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M812 646 V700" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="562" y="700" width="1340" height="88" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="588" y="738" class="box">执行侧模型回退（评论 / 发帖 / 关注等任务专用）</text>
    <text x="588" y="768" class="boxSub">DeepSeek → B.AI → NAS → MobileOffice · 与 Harness 规划链路分开</text>

    <path d="M812 702 V646" stroke="#8b939c" stroke-width="2"/>

    <rect x="72" y="820" width="360" height="88" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="98" y="858" class="box">本地回执与日报</text>
    <text x="98" y="888" class="boxSub">动作确认 · 插件日报 · 运行事实</text>

    <path d="M432 864 H492" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="492" y="820" width="340" height="88" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="518" y="858" class="box">2aran.com 回执 API</text>
    <text x="518" y="888" class="boxSub">x.2aran.com / api</text>

    <path d="M832 864 H892" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="892" y="820" width="360" height="88" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="918" y="858" class="box">D1 统计 · 设备 · 指令</text>
    <text x="918" y="888" class="boxSub">日报 · 心跳 · 远程命令队列</text>

    <path d="M1252 864 H1312" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1312 844 H1252" stroke="#8b939c" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1312" y="820" width="380" height="88" rx="14" fill="#f7f8fa" stroke="#c8cdd3" stroke-width="2"/>
    <text x="1338" y="858" class="box">站长后台 / 公开看板</text>
    <text x="1338" y="888" class="boxSub">启动 · 暂停 · 更新等指令</text>

    <path d="M1498 820 V520" stroke="#8b939c" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M1498 520 H1972" stroke="#8b939c" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
    <text x="1520" y="680" class="boxSub" fill="#6b7280">只读工具读取本机排班、日报与调度记录（不读 X 正文）</text>
  </g>
