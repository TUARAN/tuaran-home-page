<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f4"/>
      <stop offset="0.48" stop-color="#fff7f2"/>
      <stop offset="1" stop-color="#ffe8dc"/>
    </linearGradient>
    <radialGradient id="bloom" cx="12%" cy="8%" r="46%">
      <stop offset="0" stop-color="#ffd0dc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd0dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="92%" cy="18%" r="38%">
      <stop offset="0" stop-color="#ffe7bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe7bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1.1" fill="#e7b3c0" opacity="0.35"/>
      <circle cx="46" cy="28" r="0.8" fill="#efc4a4" opacity="0.45"/>
      <circle cx="92" cy="18" r="1.2" fill="#fff" opacity="0.7"/>
      <circle cx="120" cy="70" r="0.9" fill="#e7b3c0" opacity="0.3"/>
      <circle cx="30" cy="96" r="1.3" fill="#fff" opacity="0.55"/>
      <circle cx="78" cy="110" r="0.7" fill="#e8a0b4" opacity="0.35"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="1200" fill="url(#paper)"/>
  <rect width="800" height="1200" fill="url(#bloom)"/>
  <rect width="800" height="1200" fill="url(#sun)"/>
  <g opacity="0.55" filter="url(#soft)">
    <ellipse cx="90" cy="210" rx="120" ry="78" fill="#ffc2d1"/>
    <ellipse cx="690" cy="360" rx="150" ry="96" fill="#ffd7b8"/>
    <ellipse cx="180" cy="980" rx="170" ry="100" fill="#ffd0c6"/>
    <ellipse cx="640" cy="1040" rx="130" ry="80" fill="#f7c6da"/>
  </g>
  <g fill="#ff8eab" opacity="0.28">
    <g transform="translate(640 180)">
      <ellipse cx="0" cy="-34" rx="18" ry="32"/>
      <ellipse cx="0" cy="-34" rx="18" ry="32" transform="rotate(72)"/>
      <ellipse cx="0" cy="-34" rx="18" ry="32" transform="rotate(144)"/>
      <ellipse cx="0" cy="-34" rx="18" ry="32" transform="rotate(216)"/>
      <ellipse cx="0" cy="-34" rx="18" ry="32" transform="rotate(288)"/>
      <circle r="12" fill="#ffe3a6"/>
    </g>
    <g transform="translate(120 860) scale(0.72)">
      <ellipse cx="0" cy="-34" rx="18" ry="32"/>
      <ellipse cx="0" cy="-34" rx="18" ry="32" transform="rotate(72)"/>
      <ellipse cx="0" cy="-34" rx="18" ry="32" transform="rotate(144)"/>
      <ellipse cx="0" cy="-34" rx="18" ry="32" transform="rotate(216)"/>
      <ellipse cx="0" cy="-34" rx="18" ry="32" transform="rotate(288)"/>
      <circle r="12" fill="#ffe3a6"/>
    </g>
  </g>
  <rect width="800" height="1200" fill="url(#grain)"/>
</svg>
