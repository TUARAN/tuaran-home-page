<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>链上中国象棋 · 122.6.tape</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8eef7;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;min-height:100vh}main{width:min(1100px,94vw);margin:auto;padding:32px 0 48px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}h1{margin:0;font-size:clamp(28px,5vw,56px);letter-spacing:-.04em}.sub{color:#91a0b5;margin:8px 0 0}.tag{font:12px ui-monospace,monospace;color:#78e7ff;border:1px solid #24465b;border-radius:99px;padding:8px 12px}.layout{display:grid;grid-template-columns:minmax(280px,560px) 1fr;gap:28px;align-items:start}.board{position:relative;aspect-ratio:9/10;background:#d6ad68;border:1px solid #f7d79f55;border-radius:24px;overflow:hidden;box-shadow:inset 0 0 50px #75421433,0 30px 80px #0008}.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(10,1fr)}button{font:inherit}.sq{position:relative;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}.piece{display:flex;align-items:center;justify-content:center;width:78%;aspect-ratio:1;border-radius:50%;background:#f6dba5;font:900 clamp(18px,4vw,30px) serif;box-shadow:0 4px 0 #805126,0 7px 13px #371e0a66;transition:.15s}.red{color:#a82f2d;border:2px solid #a82f2d}.black{color:#24201c;border:2px solid #24201c}.sel{transform:translateY(-4px) scale(1.1);outline:4px solid #67e8f9}.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#087b4e;box-shadow:0 0 0 5px #d1fae544}.panel{display:grid;gap:14px}.card{background:#ffffff0b;border:1px solid #ffffff16;border-radius:20px;padding:20px}.eyebrow{font:12px ui-monospace,monospace;letter-spacing:.18em;color:#71def6}.turn{font-size:28px;font-weight:750;margin:10px 0 6px}.hint{color:#94a3b8;line-height:1.7;margin:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.action{border:1px solid #ffffff22;background:#ffffff0c;color:#e8eef7;border-radius:12px;padding:11px;cursor:pointer}.action.primary{background:#75e4f5;color:#07111f;font-weight:700}.action:disabled{opacity:.35}.moves{max-height:390px;overflow:auto;margin:14px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;font:12px ui-monospace,monospace;color:#a8b3c3}.moves li span{color:#526176;margin-right:7px}.foot{margin-top:24px;color:#536278;font:11px ui-monospace,monospace;text-align:center}@media(max-width:780px){main{padding-top:20px}.top{align-items:start;flex-direction:column}.layout{grid-template-columns:1fr}.panel{grid-template-columns:1fr}.board{border-radius:18px}}
</style>
</head>
<body><main>
<header class="top"><div><h1>链上中国象棋</h1><p class="sub">完整规则 · 双人同屏 · 数据只留在浏览器</p></div><span class="tag">TAPEOUT · 122.6</span></header>
<div class="layout"><div class="board">
<svg class="lines" viewBox="0 0 900 1000" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="#68411f" stroke-width="2" opacity=".64"><rect x="38" y="38" width="824" height="924" opacity=".55"/><path d="M50 50H850M50 150H850M50 250H850M50 350H850M50 450H850M50 550H850M50 650H850M50 750H850M50 850H850M50 950H850M50 50V950M850 50V950M150 50V450M250 50V450M350 50V450M450 50V450M550 50V450M650 50V450M750 50V450M150 550V950M250 550V950M350 550V950M450 550V950M550 550V950M650 550V950M750 550V950M350 50L550 250M550 50L350 250M350 750L550 950M550 750L350 950"/></g><g fill="#68411f" font-family="serif" font-size="42" font-weight="700" opacity=".68"><text x="250" y="514" text-anchor="middle">楚 河</text><text x="650" y="514" text-anchor="middle">汉 界</text></g></svg>
<div class="squares" id="board"></div></div>
<aside class="panel"><section class="card"><div class="eyebrow">LOCAL-FIRST GAME</div><div class="turn" id="turn">红方走子</div><p class="hint" id="hint">点击棋子，再点击绿色合法落点。</p><div class="actions"><button class="action" id="undo" disabled>悔棋</button><button class="action primary" id="reset">重新开始</button></div></section><section class="card"><div class="eyebrow">着法记录</div><ol class="moves" id="moves"><li>尚未走子</li></ol></section></aside></div>
<div class="foot">NO SERVER · NO TRACKER · ON-CHAIN STATIC BUILD</div>
</main><script>
const labels={r:{k:'帅',a:'仕',e:'相',h:'马',r:'车',c:'炮',p:'兵'},b:{k:'将',a:'士',e:'象',h:'马',r:'车',c:'砲',p:'卒'}};
function initial(){let p=[],id=0,add=(c,t,row,col)=>p.push({id:id++,c,t,row,col});['r','h','e','a','k','a','e','h','r'].forEach((t,c)=>add('b',t,0,c));add('b','c',2,1);add('b','c',2,7);[0,2,4,6,8].forEach(c=>add('b','p',3,c));[0,2,4,6,8].forEach(c=>add('r','p',6,c));add('r','c',7,1);add('r','c',7,7);['r','h','e','a','k','a','e','h','r'].forEach((t,c)=>add('r',t,9,c));return p}
let pieces=initial(),turn='r',selected=null,history=[],records=[],winner=null;
const at=(ps,r,c)=>ps.find(x=>x.row===r&&x.col===c),inside=(r,c)=>r>=0&&r<10&&c>=0&&c<9,path=(ps,a,r,c)=>{let n=0,dr=Math.sign(r-a.row),dc=Math.sign(c-a.col);for(let y=a.row+dr,x=a.col+dc;y!==r||x!==c;y+=dr,x+=dc)if(at(ps,y,x))n++;return n};
function raw(ps,a,r,c){if(!inside(r,c)||(at(ps,r,c)?.c===a.c))return false;let dr=r-a.row,dc=c-a.col,ar=Math.abs(dr),ac=Math.abs(dc);if(a.t==='r')return(dr===0||dc===0)&&path(ps,a,r,c)===0;if(a.t==='c'){if(dr!==0&&dc!==0)return false;let n=path(ps,a,r,c),cap=!!at(ps,r,c);return cap?n===1:n===0}if(a.t==='h'){if(!((ar===2&&ac===1)||(ar===1&&ac===2)))return false;return !at(ps,a.row+(ar===2?dr/2:0),a.col+(ac===2?dc/2:0))}if(a.t==='e')return ar===2&&ac===2&&!at(ps,a.row+dr/2,a.col+dc/2)&&(a.c==='r'?r>=5:r<=4);if(a.t==='a')return ar===1&&ac===1&&c>=3&&c<=5&&(a.c==='r'?r>=7:r<=2);if(a.t==='k')return ar+ac===1&&c>=3&&c<=5&&(a.c==='r'?r>=7:r<=2);if(a.t==='p'){let f=a.c==='r'?-1:1,cross=a.c==='r'?a.row<=4:a.row>=5;return(dr===f&&dc===0)||(cross&&dr===0&&ac===1)}return false}
function attacked(ps,color,r,c){return ps.some(a=>a.c!==color&&(raw(ps,a,r,c)||(a.t==='k'&&a.col===c&&path(ps,a,r,c)===0)))}
function check(ps,color){let k=ps.find(x=>x.c===color&&x.t==='k');return !k||attacked(ps,color,k.row,k.col)}
function legal(ps,a,r,c){if(!raw(ps,a,r,c))return false;let next=ps.filter(x=>!(x.row===r&&x.col===c)).map(x=>x.id===a.id?{...x,row:r,col:c}:x);return !check(next,a.c)}
function movesFor(a){let out=[];for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(legal(pieces,a,r,c))out.push([r,c]);return out}
function hasMove(color){return pieces.some(a=>a.c===color&&movesFor(a).length)}
function play(r,c){if(winner)return;let here=at(pieces,r,c);if(here?.c===turn){selected=here.id;draw();return}if(selected==null)return;let a=pieces.find(x=>x.id===selected);if(!legal(pieces,a,r,c))return;history.push(JSON.stringify({pieces,turn,records,winner}));let captured=at(pieces,r,c);pieces=pieces.filter(x=>x!==captured).map(x=>x.id===a.id?{...x,row:r,col:c}:x);records=[...records,`${labels[a.c][a.t]} ${a.col+1}:${a.row+1}→${c+1}:${r+1}`];turn=turn==='r'?'b':'r';selected=null;if(captured?.t==='k'||!hasMove(turn))winner=turn==='r'?'b':'r';draw()}
function undo(){let s=history.pop();if(!s)return;let state=JSON.parse(s);pieces=state.pieces;turn=state.turn;records=state.records;winner=state.winner;selected=null;draw()}
function draw(){let b=document.querySelector('#board'),a=selected==null?null:pieces.find(x=>x.id===selected),legalSet=new Set((a?movesFor(a):[]).map(x=>x.join(':')));b.innerHTML='';for(let r=0;r<10;r++)for(let c=0;c<9;c++){let x=at(pieces,r,c),q=document.createElement('button');q.className='sq';q.setAttribute('aria-label',x?`${x.c==='r'?'红':'黑'}方${labels[x.c][x.t]}`:`第${c+1}路第${r+1}行`);q.onclick=()=>play(r,c);if(legalSet.has(`${r}:${c}`))q.innerHTML='<i class="dot"></i>';if(x){let s=document.createElement('span');s.className=`piece ${x.c==='r'?'red':'black'} ${x.id===selected?'sel':''}`;s.textContent=labels[x.c][x.t];q.append(s)}b.append(q)}document.querySelector('#turn').textContent=winner?`${winner==='r'?'红':'黑'}方胜`:`${turn==='r'?'红':'黑'}方走子`;document.querySelector('#hint').textContent=winner?'对局结束，可悔棋或重开。':check(pieces,turn)?'将军！必须解除威胁。':'点击棋子，再点击绿色合法落点。';document.querySelector('#undo').disabled=!history.length;document.querySelector('#moves').innerHTML=records.length?records.map((m,i)=>`<li><span>${i+1}.</span>${m}</li>`).join(''):'<li>尚未走子</li>'}
document.querySelector('#undo').onclick=undo;document.querySelector('#reset').onclick=()=>{pieces=initial();turn='r';selected=null;history=[];records=[];winner=null;draw()};draw();
</script></body></html>
